name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # jdk.java.net replaces the JDK 28 early-access build about once a week.
    # A weekly run shows whether a new build changes what the article quotes.
    # It also keeps the Sonar token in use: SonarQube Cloud removes tokens
    # unused for 60 days, and Dependabot builds skip the Sonar step.
    - cron: '41 5 * * 2'

jobs:
  build:
    name: Build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      # The examples need JDK 28 with the incubator module jdk.incubator.json
      # (JEP 540). jdk.java.net only offers the newest early-access build, so
      # this is not always the build the article was written with.
      - name: Set up JDK 28 early access
        # Pinned to the commit, not the tag: a tag can be moved, and only
        # GitHub's own actions are exempt from that risk. Dependabot keeps
        # SHA pins current and updates the comment with them.
        uses: oracle-actions/setup-java@fff43251af9936a0e6a4d5d0946e14f1680e9b6b # v1.5.0
        with:
          website: jdk.java.net
          release: 28

      - name: Cache SonarCloud packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Verify code format
        run: mvn -B spotless:check

      - name: Compile all programs
        run: mvn -B -q compile

      - name: Analyze code with Sonar
        if: ${{ env.SONAR_TOKEN }} # the token is not available in Dependabot-triggered builds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

      - name: Download Jackson and Gson for the comparison programs
        run: mvn -B -q dependency:copy-dependencies

      # Fails if a program ends with an exception
      - name: Run all examples
        run: scripts/run-examples.sh "$JAVA_HOME"

      # Reports outputs that differ from the committed results of build
      # 28-ea+23 as warnings; never fails the build.
      - name: Compare outputs with the committed results
        if: always()
        run: |
          new=$(ls -td results/*/ | head -1)
          if [ "$new" = "results/28-ea+23-1886/" ]; then
            git diff --stat --exit-code results/ || echo "::warning::Outputs differ from the committed results"
          else
            diff -r -x environment.txt results/28-ea+23-1886 "$new" \
              | tee -a "$GITHUB_STEP_SUMMARY" \
              || echo "::warning::Outputs of $new differ from build 28-ea+23"
          fi
